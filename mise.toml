# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
node = "26.12.1"
pnpm = "12.15.0"
"github:Goldziher/poly" = "0.31.2"

[tasks.install]
description = "Install the locked workspace dependencies without lifecycle scripts"
run = "pnpm install --frozen-lockfile --ignore-scripts"

[tasks.build]
description = "Build the example site against the local theme"
run = "pnpm --dir example build"

[tasks.check]
description = "Pack the package without publishing to validate its contents"
run = "npm publish --dry-run --access public"
