required_version = ">=0.36.0"

[discovery]
exclude = [
  "**/node_modules/**",
  "**/dist/**",
  "**/.astro/**",
  "**/pnpm-lock.yaml",
  "/.ai-rulez/.generated-manifest.json",
  "/.mcp.json",
]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/node_modules/**",
  "**/dist/**",
  "**/.astro/**",
  "**/pnpm-lock.yaml",
  "/.ai-rulez/.generated-manifest.json",
  "/.mcp.json",
] }
fmt = { exclude = [
  "**/node_modules/**",
  "**/dist/**",
  "**/.astro/**",
  "**/pnpm-lock.yaml",
  "/.ai-rulez/.generated-manifest.json",
  "/.mcp.json",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/pnpm-lock.yaml", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }

[engines.typos]
# typos is opt-in in poly v2; this keeps the v1 default (on).
enabled = true

[engines.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[per_file_ignores]
# astro:content is an Astro virtual module typed by generated .astro/ files, which are not committed. ~keep
"example/src/content.config.ts" = ["TS2307"]

[engines.skif]
enabled = true
dir = "."
# The root package is the published @xberg-io/docs-theme, so it cannot be private. ~keep
ignore = ["root-package-private-field"]

[engines.tsrs]
enabled = true
dir = "."

[engines.harper]
enabled = true
# Off: rules that contradict the org's sentence-case headings and no-Oxford-comma style, or misread technical prose
# (denylist, MB, stdin). ~keep
ignore = [
  "UseTitleCase",
  "OxfordComma",
  "SplitWords",
  "OrthographicConsistency",
  "ExpandMemoryShorthands",
  "ExpandStandardInputAndOutput",
  "ExpandConfiguration",
  "ExpandMinimum",
]
