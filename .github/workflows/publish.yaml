name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack without publishing"
        required: false
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish @xberg-io/docs-theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm

      - name: Install dependencies
        run: mise run install

      - name: Pack (validate)
        run: mise run check

      - name: Publish (Trusted Publishing + provenance)
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        run: mise run publish
